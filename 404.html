<!DOCTYPE html>

<head>

<title>走丢了 · 梦眠馆 · 古明地华</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<style>
  html,body{height:100%;margin:0}
  body{display:flex;align-items:center;justify-content:center;text-align:center;
    font-family:"Microsoft YaHei","PingFang SC",sans-serif;color:#3f3a5c;
    background:radial-gradient(ellipse 60% 50% at 20% 10%,#dbe9ff,transparent 60%),
      radial-gradient(ellipse 55% 45% at 85% 90%,#ffe0ee,transparent 65%),
      linear-gradient(160deg,#fbfcff,#f5f1ff 55%,#fff2f8)}
  .box{max-width:560px;padding:40px 28px;border-radius:28px;background:rgba(255,255,255,.9);

  .eye{font-size:56px;line-height:1;animation:float 4s ease-in-out infinite}
  @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
  h1{font-family:"STKaiti","KaiTi",serif;font-size:34px;margin:16px 0 8px;letter-spacing:.12em;
    background:linear-gradient(100deg,#4a63c8,#9d9bee,#e57aa9);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
  p{color:#6a628c;line-height:2;margin:6px 0}
  a{display:inline-block;margin-top:18px;padding:11px 28px;border-radius:999px;color:#fff;text-decoration:none;
    background:linear-gradient(120deg,#6f9ff0,#9d9bee 55%,#e57aa9);box-shadow:0 10px 24px rgba(111,159,240,.35)}
  small{color:#c2bad9}
</style>
</head>
<body>
  <div class="box">
    <div class="eye">👁️</div>
    <h1>这里什么都没有哦～</h1>

    <p>「呼啊～～是不是走错房间了？……没关系，被窝在这边～～」</p>
    <a href="./index.html">回到梦眠馆</a>
    <p><small>404 · 梦眠馆 · 古明地华</small></p>
  </div>
</body>
</html>
